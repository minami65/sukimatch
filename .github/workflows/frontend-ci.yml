name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier Check
        run: npm run format:check

      - name: Run Unit Tests
        run: npm run test:run

      - name: Build App
        run: npm run build
